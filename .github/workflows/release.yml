name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP (non-vendor)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

      - name: Resolve and validate version
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' pryviko-quick-order.php | head -1 | tr -d '[:space:]')"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')"
          echo "Tag version: ${VERSION}"
          echo "Plugin Version: ${PLUGIN_VERSION}"
          echo "Stable tag: ${STABLE_TAG}"
          if [[ "${VERSION}" != "${PLUGIN_VERSION}" ]]; then
            echo "ERROR: tag version (${VERSION}) != plugin Version (${PLUGIN_VERSION})" >&2
            exit 1
          fi
          if [[ "${VERSION}" != "${STABLE_TAG}" ]]; then
            echo "ERROR: tag version (${VERSION}) != readme Stable tag (${STABLE_TAG})" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build production zip
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          ./scripts/build-release-zip.sh "${VERSION}"
          cp "dist/pryviko-quick-order-${VERSION}.zip" "pryviko-quick-order-${VERSION}.zip"
          ls -lh "pryviko-quick-order-${VERSION}.zip"

      - name: Deploy to Freemius
        id: freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        with:
          file_name: pryviko-quick-order-${{ steps.meta.outputs.VERSION }}.zip
          release_mode: released
          version: ${{ steps.meta.outputs.VERSION }}
          sandbox: false
        env:
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          PLUGIN_ID: ${{ secrets.FREEMIUS_PLUGIN_ID }}
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          PLUGIN_SLUG: pryviko-quick-order

      - name: Prepare free build for WordPress.org
        run: |
          set -euo pipefail
          mkdir -p build-free
          unzip -q "${{ steps.freemius.outputs.free_version }}" -d build-free
          rm -f build-free/pryviko-quick-order/.gitignore
          if [[ -d .wordpress-org ]]; then
            cp -a .wordpress-org build-free/pryviko-quick-order/.wordpress-org
          fi
          ls -la build-free/pryviko-quick-order | head

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: pryviko-quick-order
          BUILD_DIR: build-free/pryviko-quick-order
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Attach Freemius zips to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.freemius.outputs.free_version }}
            ${{ steps.freemius.outputs.pro_version }}
